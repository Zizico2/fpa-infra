services:
  adapter:
    platform: linux/amd64
    image: fpa-proxy:local
    build:
      context: .
      dockerfile: containers/Dockerfile
      args:
        SERVICE: fpa-proxy
        SOURCE_REVISION: ${ADAPTER_REVISION}
    ports: ["127.0.0.1:${FPA_ADAPTER_PORT:-50201}:8080"]
    environment:
      RUST_LOG: fpa_proxy=info,fpa_service=info
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
  gateway:
    platform: linux/amd64
    image: fpa-gateway:local
    build:
      context: .
      dockerfile: containers/Dockerfile
      args:
        SERVICE: fpa-gateway
        SOURCE_REVISION: ${GATEWAY_REVISION}
    ports: ["127.0.0.1:${FPA_GATEWAY_PORT:-50202}:8080"]
    environment:
      FPA_GATEWAY_UPSTREAM_ADDRESS: http://adapter:8080
      FPA_GATEWAY_CACHE_MIB: "64"
      FPA_GATEWAY_CACHE_NEUTRAL_METADATA: x-forwarded-for,x-forwarded-proto,x-forwarded-host,forwarded,x-cloud-trace-context,traceparent,tracestate
      RUST_LOG: fpa_gateway=info,fpa_gateway_core=info
    depends_on: [adapter]
    restart: on-failure:3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
